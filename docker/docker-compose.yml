name: financial-mathematical-models

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: financial-mathematical-models:latest
    container_name: financial-mathematical-models
    ports:
      - "8080:8080"
    environment:
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:?FLASK_SECRET_KEY must be set in the host environment or .env file}"
      FLASK_ENV: "${FLASK_ENV:-production}"
    restart: unless-stopped
