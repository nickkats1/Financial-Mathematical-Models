[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-mathematical-models"
version = "0.1.0"
description = "Financial mathematical models for portfolio analysis (MPT, SIM, utility, VaR/CVaR)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nick Katsarelas" }]

dependencies = [
    "Flask>=3.0",
    "Flask-Limiter>=3.5",
    "Flask-WTF>=1.2",
    "cachetools>=5.3",
    "gunicorn>=22.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyportfolioopt>=1.5",
    "tenacity>=8.2",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-cachetools",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/nickkats1/Financial-Mathematical-Models"
Repository = "https://github.com/nickkats1/Financial-Mathematical-Models"

[tool.setuptools]
packages = ["app", "portfolio", "portfolio.data", "portfolio.models"]

[tool.setuptools.package-dir]
portfolio = "src/portfolio"

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "ignore::UserWarning:pypfopt.risk_models",
]

[tool.coverage.run]
branch = true
source = ["portfolio", "app"]

# src/ layout: reconcile the editable-install path with an installed copy so a
# single report covers both.
[tool.coverage.paths]
source = ["src/portfolio", "*/site-packages/portfolio"]

[tool.coverage.report]
show_missing = true
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are illustrative API demos, not shipped code — don't lint them.
extend-exclude = ["notebooks", "venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/portfolio", "app", "wsgi.py"]
