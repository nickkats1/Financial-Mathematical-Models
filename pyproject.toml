[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-mathematical-models"
version = "0.1.0"
description = "Financial mathematical models for portfolio analysis (MPT, SIM, utility, VaR/CVaR)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nick Katsarelas" }]
dependencies = [
    "Flask>=3.0",
    "gunicorn>=22.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyportfolioopt>=1.5",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbconvert>=7.0", "nbclient>=0.10"]

[tool.setuptools.packages.find]
include = ["portfolio*", "app*"]
exclude = ["tests*", "notebooks*", "venv*"]
