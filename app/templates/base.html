<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Portfolio Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="{{ url_for('main.index') }}">Financial Mathematical Models</a>
        <nav>
          <a href="{{ url_for('main.index') }}">New analysis</a>
          <a href="https://github.com/" target="_blank" rel="noopener">Source</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container">
        <span>Built with Flask, pypfopt, statsmodels, and yfinance.</span>
      </div>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </body>
</html>
